# Preview-channel deploy for same-repo PRs. Skips forks (they cannot use
# this repo's Firebase secret). Comments the preview URL on the PR.
# Requires repo secret FIREBASE_SERVICE_ACCOUNT_PERSONAL_328013.
# https://github.com/FirebaseExtended/action-hosting-deploy
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_328013 }}
          projectId: personal-328013
