baseURL: https://blog.niima.cloud/
title: Nima`s Public Journal
theme: ["PaperMod"]
pagination.pagerSize: 10

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  en:
    languageName: English
    languageCode: en-us
    languageDirection: ltr
    weight: 1
    title: Nima`s Public Journal
    params:
      languageAltTitle: English
      description: "Nima`s Public Journal made available for everyone for no reason."
    menu:
      main:
        - identifier: tags
          name: tags
          url: /tags/
          weight: 20
  fa:
    languageName: فارسی
    languageCode: fa
    languageDirection: rtl
    weight: 2
    title: Nima`s Public Journal
    params:
      languageAltTitle: فارسی
      description: "نسخهٔ فارسی دفترچهٔ عمومی نیما. نوشته‌های انگلیسی در نسخهٔ اصلی مانده‌اند؛ اینجا به‌مرور یادداشت‌های فارسی می‌آید."
      DateFormat: "2 January 2006"
      homeInfoParams:
        Title: "نسخهٔ فارسی"
        Content: |
          اینجا نسخهٔ راست‌به‌چپ دفترچهٔ عمومی نیماست. نوشته‌های انگلیسی سر جایشان در [نسخهٔ English](/) مانده‌اند.
          اگر کلمه‌ای انگلیسی وسط متن فارسی دیدید، قرار است همان‌طور بخوانیدش.
    menu:
      main:
        - identifier: tags
          name: برچسب‌ها
          url: /tags/
          weight: 20
        - identifier: archives
          name: بایگانی
          url: /archives/
          weight: 30
        - identifier: search
          name: جستجو
          url: /search/
          weight: 40

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  keywords: [Blog, Journal]
  author: Nima Hashemi
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false
  displayFullLangName: true

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  # ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  # UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  # socialIcons:
  #   - name: x
  #     url: "https://x.com/"
  #   - name: stackoverflow
  #     url: "https://stackoverflow.com"
  #   - name: github
  #     url: "https://github.com/"
